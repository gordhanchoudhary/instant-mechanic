<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Instant Mechanic — Support Chat</title>
<style>
  :root{
    --wa-dark:#075E54;
    --wa-teal:#128C7E;
    --wa-green:#25D366;
    --wa-bg:#E5DDD5;
    --wa-in:#FFFFFF;
    --wa-out:#DCF8C6;
    --wa-red:#E53935;
    --wa-red-soft:#FADBD8;
    --wa-text:#111B21;
    --wa-sub:#667781;
    --panel-border:#E9EDEF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Helvetica,Arial,sans-serif;
    color:var(--wa-text);
    background:#f0f2f5;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;background:var(--wa-dark);color:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;}
  .topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--wa-green);}
  .topbar input[type=date]{
    border:none;border-radius:6px;padding:5px 8px;font-size:13px;margin-left:12px;
  }
  .topbar .right{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:6px;
    padding:6px 10px;font-size:13px;cursor:pointer;
  }
  .icon-btn:hover{background:rgba(255,255,255,.22);}
  .agent-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
    padding:5px 10px;border-radius:20px;font-size:13px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--wa-green);display:inline-block;}
  .offline-dot{width:8px;height:8px;border-radius:50%;background:#dc3545;display:inline-block;}

  .app{display:flex;height:calc(100vh - 49px);}

  /* Sidebar */
  .sidebar{width:360px;min-width:300px;background:#fff;border-right:1px solid var(--panel-border);
    display:flex;flex-direction:column;}
  .search-box{padding:10px;border-bottom:1px solid var(--panel-border);}
  .search-box input{
    width:100%;padding:9px 12px;font-size:14px;border:none;background:#f0f2f5;border-radius:20px;
  }
  .search-box input:focus{outline:2px solid var(--wa-teal);}
  .customer-list{flex:1;overflow-y:auto;}
  .customer{
    padding:12px 14px;border-bottom:1px solid #f2f2f2;cursor:pointer;
    display:flex;flex-direction:column;gap:2px;position:relative;transition:background .15s;
  }
  .customer:hover{background:#f5f6f6;}
  .customer.active{background:#f0f2f5;}
  .customer.flag-cancel{background:var(--wa-red-soft);}
  .customer.flag-cancel .cust-top strong{color:var(--wa-red);}
  .customer.flag-booking{background:#dff5e1;}
  .customer.flag-stale{background:#f5b7b1;}
  .cust-top{display:flex;justify-content:space-between;align-items:center;}
  .cust-name{font-weight:600;font-size:14.5px;}
  .cust-name.unread{font-weight:700;}
  .cust-time{font-size:11.5px;color:var(--wa-sub);white-space:nowrap;}
  .cust-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .cust-preview{font-size:13px;color:var(--wa-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .cust-preview.unread{color:var(--wa-text);font-weight:600;}
  .badge{background:var(--wa-green);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;}
  .badge.badge-red{background:var(--wa-red);}
  .tag-row{display:flex;gap:4px;margin-top:2px;}
  .tag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;letter-spacing:.2px;}
  .tag.cancel{background:var(--wa-red);color:#fff;}
  .tag.booked{background:var(--wa-green);color:#fff;}
  .tag.stale{background:#c0392b;color:#fff;}
  .empty-hint{padding:30px 16px;color:var(--wa-sub);font-size:13px;text-align:center;}

  /* Chat window */
  .chat-panel{flex:1;display:flex;flex-direction:column;background:var(--wa-bg);
    background-image:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4));}
  .chat-header{
    background:#f0f2f5;padding:10px 16px;border-bottom:1px solid var(--panel-border);
    display:flex;align-items:center;gap:10px;
  }
  .back-btn{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--wa-teal);padding:0 4px;}
  .chat-header .name{font-weight:600;font-size:15px;}
  .chat-header .sub{font-size:12px;color:var(--wa-sub);}
  .chat-messages{flex:1;overflow-y:auto;padding:16px 8%;display:flex;flex-direction:column;}
  .chat-bubble{max-width:65%;padding:8px 10px 6px 10px;border-radius:8px;margin:3px 0;font-size:14px;
    line-height:1.35;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08);word-wrap:break-word;}
  .from-user{background:var(--wa-in);align-self:flex-start;border-top-left-radius:0;}
  .from-agent{background:var(--wa-out);align-self:flex-end;border-top-right-radius:0;}
  .from-agent.pending{opacity:.6;}
  .from-agent.failed{background:#ffd7d7;}
  .bubble-text{white-space:pre-wrap;}
  .bubble-meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:2px;}
  .timestamp{font-size:10.5px;color:#8a8a8a;}
  .tick{font-size:12px;color:#4fc3f7;}
  .retry-link{font-size:11px;color:var(--wa-red);cursor:pointer;text-decoration:underline;margin-left:6px;}
  .call-message{align-self:center;background:#fef3cd;color:#5c4a00;padding:5px 12px;font-size:12.5px;
    border-radius:8px;margin:10px 0;}
  .divider{align-self:center;background:#dcf3fb;color:#0d5a76;font-size:11.5px;font-weight:600;
    padding:4px 14px;border-radius:8px;margin:14px 0 8px 0;box-shadow:0 1px 1px rgba(0,0,0,.08);}
  .day-divider{align-self:center;background:#e1f2fb;color:#3b4a54;font-size:11.5px;
    padding:4px 12px;border-radius:8px;margin:10px 0;}

  .booking-button{background:var(--wa-green);color:#fff;padding:6px 14px;border:none;border-radius:16px;
    font-size:13px;cursor:pointer;align-self:center;margin-bottom:10px;font-weight:600;}
  .booking-details{background:#fff;border-left:4px solid var(--wa-teal);padding:12px 14px;margin:0 0 14px 0;
    border-radius:8px;font-size:13.5px;line-height:1.5;align-self:center;width:90%;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .booking-details hr{border:none;border-top:1px dashed #ddd;margin:8px 0;}

  .quick-replies{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;background:#f0f2f5;
    border-top:1px solid var(--panel-border);}
  .quick-chip{background:#fff;border:1px solid #d6dbdd;color:var(--wa-teal);padding:6px 12px;
    border-radius:16px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-weight:500;}
  .quick-chip:hover{background:#e9f7f4;}

  .composer{display:flex;align-items:flex-end;gap:8px;padding:10px 14px;background:#f0f2f5;}
  .composer textarea{
    flex:1;resize:none;border:none;border-radius:20px;padding:10px 16px;font-size:14px;
    max-height:110px;font-family:inherit;line-height:1.4;
  }
  .composer textarea:focus{outline:2px solid var(--wa-teal);}
  .send-btn{background:var(--wa-teal);border:none;color:#fff;width:42px;height:42px;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .send-btn:disabled{background:#a9c9c4;cursor:not-allowed;}
  .send-btn:hover:not(:disabled){background:var(--wa-dark);}

  .no-chat-selected{flex:1;display:flex;align-items:center;justify-content:center;color:var(--wa-sub);
    font-size:14px;flex-direction:column;gap:10px;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;
    align-items:center;z-index:1000;}
  .modal-content{background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.3);
    max-width:380px;width:90%;text-align:center;}
  .modal-content h2{color:var(--wa-teal);margin-bottom:18px;font-size:21px;}
  .agent-select{width:100%;padding:11px;font-size:15px;border:2px solid #ddd;border-radius:6px;
    margin-bottom:18px;background:#fff;}
  .agent-select:focus{outline:none;border-color:var(--wa-teal);}
  .select-button{background:var(--wa-teal);color:#fff;padding:11px 24px;border:none;border-radius:6px;
    font-size:15px;cursor:pointer;width:100%;font-weight:600;}
  .select-button:hover{background:var(--wa-dark);}
  .select-button:disabled{background:#ccc;cursor:not-allowed;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;
    padding:10px 20px;border-radius:8px;font-size:13.5px;z-index:2000;box-shadow:0 2px 8px rgba(0,0,0,.3);
    animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  a{color:var(--wa-teal);}

  /* Mobile */
  @media (max-width: 820px){
    .app{position:relative;overflow:hidden;}
    .sidebar{width:100%;min-width:0;position:absolute;inset:0;z-index:2;transition:transform .2s;}
    .chat-panel{position:absolute;inset:0;z-index:3;transform:translateX(100%);transition:transform .2s;}
    body.chat-open .sidebar{transform:translateX(-100%);}
    body.chat-open .chat-panel{transform:translateX(0);}
    .back-btn{display:inline-block;}
    .chat-messages{padding:12px 4%;}
    .topbar input[type=date]{margin-left:6px;}
    .topbar .brand span.label{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <span class="label">Instant Mechanic — Support</span>
    <input type="date" id="datePicker" onchange="onDateChange()" />
  </div>
  <div class="right">
    <button class="icon-btn" id="soundToggle" onclick="toggleSound()" title="Toggle notification sound">🔔 On</button>
    <div class="agent-chip" id="currentAgentDisplay"></div>
  </div>
</div>

<!-- Agent Selection Modal -->
<div id="agentModal" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <h2>Select Your Agent Name</h2>
    <p>Please choose your name from the list below:</p>
    <select id="agentSelect" class="agent-select">
      <option value="">Loading agents...</option>
    </select>
    <button id="confirmAgent" class="select-button" onclick="confirmAgentSelection()" disabled>Continue</button>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="search-box">
      <input type="text" placeholder="Search name or mobile..." id="searchInput" oninput="filterCustomers()"/>
    </div>
    <div class="customer-list" id="customerList"></div>
  </div>

  <div class="chat-panel" id="chatPanel">
    <div class="no-chat-selected" id="noChatSelected">
      <div style="font-size:40px;">💬</div>
      <div>Select a conversation to start</div>
    </div>
    <div id="chatActive" style="display:none;height:100%;flex-direction:column;">
      <div class="chat-header">
        <button class="back-btn" onclick="closeMobileChat()">←</button>
        <div>
          <div class="name" id="chatHeaderName">-</div>
          <div class="sub" id="chatHeaderMobile">-</div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="quick-replies" id="quickReplies"></div>
      <div class="composer">
        <textarea id="messageInput" placeholder="Type a message" rows="1" onkeydown="handleComposerKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendCurrentMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const API_BASE = 'https://ai.instantmechanic.online/bot/';
const SEND_MSG_URL = API_BASE + 'send-msg';
const AGENTS_URL = API_BASE + 'api/agent/';
const CHATS_URL_BASE = API_BASE + 'customer_chats/';
const POLL_MS = 30000;
const STALE_MS = 5 * 60 * 1000;      // 5 min no-reply-from-agent staleness
const CANCEL_WINDOW_MS = 5 * 60 * 1000; // last 5 min for "cancel" flag

const QUICK_REPLIES = [
  "Please send your current location as discussed on call",
  "Please pay the security amount as discussed",
  "Mechanic is on the way and will reach you soon"
];

/* ================= STATE ================= */
let allAgents = [];
let currentAgent = null;
let allCustomers = [];
let selectedMobile = null;
let pollTimer = null;
let sendingInFlight = false;
let soundMuted = localStorage.getItem('im_sound_muted') === '1';

/* ================= UTIL ================= */
function ls(key){ return localStorage.getItem(key); }
function setLs(key,val){ localStorage.setItem(key,val); }
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function makeLinksClickable(text){
  const escaped = escapeHtml(text);
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return escaped.replace(urlRegex, function(url){
    const cleanUrl = url.replace(/[.,;!?]+$/, '');
    const trailing = url.substring(cleanUrl.length);
    return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>${trailing}`;
  });
}
function formatTime(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function formatDayLabel(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString([], { day:'2-digit', month:'short', year:'numeric' });
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function beep(){
  if (soundMuted) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.26);
  }catch(e){ /* audio not available, ignore */ }
}
function toggleSound(){
  soundMuted = !soundMuted;
  setLs('im_sound_muted', soundMuted ? '1' : '0');
  document.getElementById('soundToggle').innerText = soundMuted ? '🔕 Off' : '🔔 On';
}

let baseTitle = document.title;
let flashTimer = null;
function flashTitle(on){
  if (on){
    if (flashTimer) return;
    let show = false;
    flashTimer = setInterval(()=>{
      document.title = show ? baseTitle : '🔴 New message';
      show = !show;
    }, 1200);
  } else if (flashTimer){
    clearInterval(flashTimer);
    flashTimer = null;
    document.title = baseTitle;
  }
}
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden) flashTitle(false);
});

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('datePicker').valueAsDate = new Date();
  document.getElementById('soundToggle').innerText = soundMuted ? '🔕 Off' : '🔔 On';
  initializeApp();
});

let pendingAutoOpenMobile = null;

async function initializeApp(){
  await loadAgents();

  const params = new URLSearchParams(window.location.search);
  const paramAgent = params.get('agent_name');
  const paramMobile = params.get('mobile');
  if (paramMobile) pendingAutoOpenMobile = paramMobile;

  let agentToUse = null;
  if (paramAgent){
    agentToUse = allAgents.find(a => a.name === paramAgent);
  }
  if (!agentToUse){
    const storedAgent = ls('im_agent_name');
    if (storedAgent) agentToUse = allAgents.find(a => a.name === storedAgent);
  }

  if (agentToUse){
    currentAgent = agentToUse;
    setLs('im_agent_name', currentAgent.name);
    updateAgentDisplay();
    startPolling();
    return;
  }
  showAgentModal();
}

async function loadAgents(){
  try{
    const res = await fetch(AGENTS_URL);
    allAgents = await res.json();
  }catch(e){
    console.error('Error loading agents', e);
    allAgents = [{ name:'Auto Agent', is_live:true, total_chats:0 }];
  }
  populateAgentSelect();
}

function populateAgentSelect(){
  const select = document.getElementById('agentSelect');
  select.innerHTML = '<option value="">Select an agent...</option>';
  const sorted = [...allAgents].sort((a,b)=>{
    if (a.is_live && !b.is_live) return -1;
    if (!a.is_live && b.is_live) return 1;
    return (b.total_chats||0) - (a.total_chats||0);
  });
  sorted.forEach(agent=>{
    const opt = document.createElement('option');
    opt.value = agent.name;
    opt.textContent = `${agent.name} ${agent.is_live ? '🟢' : '🔴'} (${agent.total_chats||0} chats)`;
    select.appendChild(opt);
  });
}

function showAgentModal(){
  document.getElementById('agentModal').style.display = 'flex';
  document.getElementById('agentSelect').onchange = function(){
    document.getElementById('confirmAgent').disabled = !this.value;
  };
}
function confirmAgentSelection(){
  const name = document.getElementById('agentSelect').value;
  if (!name) return;
  setLs('im_agent_name', name);
  currentAgent = allAgents.find(a => a.name === name);
  document.getElementById('agentModal').style.display = 'none';
  updateAgentDisplay();
  startPolling();
}
function changeAgent(){ showAgentModal(); }
function updateAgentDisplay(){
  const el = document.getElementById('currentAgentDisplay');
  if (!currentAgent) return;
  const dot = currentAgent.is_live ? '<span class="live-dot"></span>' : '<span class="offline-dot"></span>';
  el.innerHTML = `<strong>${escapeHtml(currentAgent.name)}</strong> ${dot}
    <button class="icon-btn" style="margin-left:8px;padding:3px 8px;" onclick="changeAgent()">Change</button>`;
}

/* ============ POLLING ============ */
function onDateChange(){ fetchChats(true); }
function startPolling(){
  fetchChats(true);
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>fetchChats(false), POLL_MS);
}

async function fetchChats(isFreshLoad){
  if (!currentAgent) return;
  const dateVal = document.getElementById('datePicker').value;
  const agentName = encodeURIComponent(currentAgent.name);
  try{
    const res = await fetch(`${CHATS_URL_BASE}?date=${dateVal}&agent_name=${agentName}`);
    const data = await res.json();
    if (data.status !== 'success') return;

    const newCustomers = data.data || [];
    const prevByMobile = {};
    allCustomers.forEach(c => prevByMobile[c.mobile] = c);

    let anyNewIncoming = false;

    newCustomers.forEach(c => {
      const prev = prevByMobile[c.mobile];
      const prevLastTs = prev && prev.chats.length ? prev.chats[prev.chats.length-1].timestamp : null;
      const newLastMsg = c.chats.length ? c.chats[c.chats.length-1] : null;

      if (newLastMsg && newLastMsg.is_from_customer && (!prevLastTs || new Date(newLastMsg.timestamp) > new Date(prevLastTs))){
        // genuinely new incoming customer message since our last poll
        if (!isFreshLoad) anyNewIncoming = true;
      }
    });

    allCustomers = newCustomers;
    renderCustomerList(getFilteredCustomers());

    if (pendingAutoOpenMobile){
      const target = allCustomers.find(c => c.mobile === pendingAutoOpenMobile);
      if (target){
        selectCustomer(pendingAutoOpenMobile);
        pendingAutoOpenMobile = null;
      }
    }

    if (selectedMobile){
      const cust = allCustomers.find(c => c.mobile === selectedMobile);
      if (cust) renderChat(cust, false);
    }

    if (anyNewIncoming){
      beep();
      if (document.hidden) flashTitle(true);
    }
  }catch(e){
    console.error('Error loading chats', e);
  }
}

/* ============ CUSTOMER META / LIST ============ */
function getReadCutoff(c){
  // Prefer the per-customer "last opened" timestamp we stamped in localStorage.
  // If we've never opened this customer on this device, fall back to the agent's
  // own updated_at from the agent API so old messages aren't shown as new/unread.
  const lastSeen = ls('im_lastseen_' + c.mobile);
  if (lastSeen) return new Date(lastSeen).getTime();
  if (currentAgent && currentAgent.updated_at) return new Date(currentAgent.updated_at).getTime();
  return null; // no baseline at all — treat as read rather than flooding with "new"
}
function getUnreadCount(c){
  const cutoff = getReadCutoff(c);
  if (cutoff === null) return 0;
  return countUnreadFrom(c, cutoff);
}
function countUnreadFrom(c, sinceMs){
  return c.chats.filter(m => m.is_from_customer && new Date(m.timestamp).getTime() > sinceMs).length;
}
function unreadIsCustomerReply(c){
  // True if the customer has an unread message that came in AFTER the agent
  // last messaged them — i.e. this is a reply to something we sent, not a
  // fresh/unprompted message.
  const lastSent = ls('im_lastsent_' + c.mobile);
  if (!lastSent) return false;
  const lastSentMs = new Date(lastSent).getTime();
  const cutoff = getReadCutoff(c);
  return c.chats.some(m => m.is_from_customer &&
    new Date(m.timestamp).getTime() > lastSentMs &&
    (cutoff === null || new Date(m.timestamp).getTime() > cutoff));
}
function isCancelRecent(c){
  const now = Date.now();
  return c.chats.some(m => m.is_from_customer &&
    (now - new Date(m.timestamp).getTime()) <= CANCEL_WINDOW_MS &&
    (m.message||'').toLowerCase().includes('cancel'));
}
function isStale(c){
  // Complete red: last activity is older than 5 minutes and there's no booking.
  // Booking always wins (stays green) regardless of how old the last message is.
  if (hasBooking(c)) return false;
  if (!c.chats.length) return false;
  const last = c.chats[c.chats.length-1];
  return (Date.now() - new Date(last.timestamp).getTime()) > STALE_MS;
}
function hasBooking(c){ return c.bookings && c.bookings.length > 0; }

function getFilteredCustomers(){
  const query = (document.getElementById('searchInput').value || '').toLowerCase();
  if (!query) return allCustomers;
  return allCustomers.filter(c =>
    (c.name||'').toLowerCase().includes(query) || (c.mobile||'').includes(query));
}
function filterCustomers(){ renderCustomerList(getFilteredCustomers()); }

function renderCustomerList(customers){
  const sorted = [...customers].sort((a,b)=>{
    const cancelA = isCancelRecent(a), cancelB = isCancelRecent(b);
    if (cancelA && !cancelB) return -1;
    if (!cancelA && cancelB) return 1;
    const lastA = a.chats.length ? new Date(a.chats[a.chats.length-1].timestamp) : new Date(0);
    const lastB = b.chats.length ? new Date(b.chats[b.chats.length-1].timestamp) : new Date(0);
    return lastB - lastA;
  });

  const list = document.getElementById('customerList');
  list.innerHTML = '';

  if (!sorted.length){
    list.innerHTML = '<div class="empty-hint">No conversations for this date.</div>';
    return;
  }

  sorted.forEach(c => {
    const div = document.createElement('div');
    const cancel = isCancelRecent(c);
    const booked = hasBooking(c);
    const stale = isStale(c);
    let cls = 'customer';
    if (c.mobile === selectedMobile) cls += ' active';
    if (cancel) cls += ' flag-cancel';
    else if (booked) cls += ' flag-booking';
    else if (stale) cls += ' flag-stale';
    div.className = cls;

    const unread = getUnreadCount(c);
    const badgeIsReply = unread > 0 && unreadIsCustomerReply(c);
    const lastMsg = c.chats.length ? c.chats[c.chats.length-1] : null;
    const lastTime = lastMsg ? formatTime(lastMsg.timestamp) : '';
    const preview = lastMsg ? (lastMsg.is_from_customer ? '' : '✓ ') + lastMsg.message.slice(0,38) : 'No messages yet';

    let tags = '';
    if (cancel) tags += '<span class="tag cancel">CANCEL RISK</span>';
    if (booked) tags += '<span class="tag booked">BOOKED</span>';
    if (stale && !cancel) tags += '<span class="tag stale">NO REPLY 5m+</span>';

    div.innerHTML = `
      <div class="cust-top">
        <span class="cust-name ${unread ? 'unread':''}">${escapeHtml(c.name || 'Unnamed')} (${escapeHtml(c.mobile)})</span>
        <span class="cust-time">${lastTime}</span>
      </div>
      <div class="cust-bottom">
        <span class="cust-preview ${unread ? 'unread':''}">${escapeHtml(preview)}</span>
        ${unread ? `<span class="badge ${badgeIsReply ? 'badge-red' : ''}">${unread}</span>` : ''}
      </div>
      ${tags ? `<div class="tag-row">${tags}</div>` : ''}
    `;
    div.onclick = () => selectCustomer(c.mobile);
    list.appendChild(div);
  });
}

/* ============ CHAT VIEW ============ */
function selectCustomer(mobile){
  selectedMobile = mobile;
  setLs('im_lastseen_' + mobile, new Date().toISOString());
  document.getElementById('noChatSelected').style.display = 'none';
  document.getElementById('chatActive').style.display = 'flex';
  document.body.classList.add('chat-open');
  const cust = allCustomers.find(c => c.mobile === mobile);
  if (cust) renderChat(cust, true);
  renderCustomerList(getFilteredCustomers());
  buildQuickReplies();
}
function closeMobileChat(){
  document.body.classList.remove('chat-open');
}

function renderChat(customer, scrollToBottom){
  document.getElementById('chatHeaderName').innerText = customer.name || 'Unnamed';
  document.getElementById('chatHeaderMobile').innerText = customer.mobile;

  const box = document.getElementById('chatMessages');
  const wasAtBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 60;
  box.innerHTML = '';

  if (hasBooking(customer)){
    const btn = document.createElement('button');
    btn.className = 'booking-button';
    btn.innerText = '📄 View Booking Details';
    btn.onclick = () => toggleBookingDetails(customer);
    box.appendChild(btn);
  }

  let allMessages = [];
  customer.chats.forEach(m => allMessages.push({ type:'chat', ...m }));
  customer.calls.forEach(c => allMessages.push({ type:'call', timestamp:c.created_at }));
  allMessages.sort((a,b)=> new Date(a.timestamp) - new Date(b.timestamp));

  const lastAgentSentAt = ls('im_lastsent_' + customer.mobile);
  let dividerInserted = false;
  let lastDayLabel = null;

  allMessages.forEach(msg => {
    const dayLabel = formatDayLabel(msg.timestamp);
    if (dayLabel !== lastDayLabel){
      const dd = document.createElement('div');
      dd.className = 'day-divider';
      dd.innerText = dayLabel;
      box.appendChild(dd);
      lastDayLabel = dayLabel;
    }

    if (lastAgentSentAt && !dividerInserted && msg.type === 'chat' && msg.is_from_customer &&
        new Date(msg.timestamp) > new Date(lastAgentSentAt)){
      const div = document.createElement('div');
      div.className = 'divider';
      div.innerText = '🔵 New reply after your message';
      box.appendChild(div);
      dividerInserted = true;
    }

    if (msg.type === 'call'){
      const callDiv = document.createElement('div');
      callDiv.className = 'call-message';
      callDiv.innerText = `📞 Call made at ${formatTime(msg.timestamp)}`;
      box.appendChild(callDiv);
    } else {
      const bubble = document.createElement('div');
      let bcls = `chat-bubble ${msg.is_from_customer ? 'from-user' : 'from-agent'}`;
      if (msg._pending) bcls += ' pending';
      if (msg._failed) bcls += ' failed';
      bubble.className = bcls;
      const textDiv = document.createElement('div');
      textDiv.className = 'bubble-text';
      textDiv.innerHTML = makeLinksClickable(msg.message);
      bubble.appendChild(textDiv);

      const meta = document.createElement('div');
      meta.className = 'bubble-meta';
      const time = document.createElement('span');
      time.className = 'timestamp';
      time.innerText = msg._pending ? 'Sending…' : (msg._failed ? 'Not sent' : formatTime(msg.timestamp));
      meta.appendChild(time);
      if (!msg.is_from_customer && !msg._pending && !msg._failed){
        const tick = document.createElement('span');
        tick.className = 'tick';
        tick.innerText = '✓✓';
        meta.appendChild(tick);
      }
      if (msg._failed){
        const retry = document.createElement('span');
        retry.className = 'retry-link';
        retry.innerText = 'Retry';
        retry.onclick = () => retrySend(customer.mobile, msg);
        meta.appendChild(retry);
      }
      bubble.appendChild(meta);
      box.appendChild(bubble);
    }
  });

  if (scrollToBottom || wasAtBottom){
    box.scrollTop = box.scrollHeight;
  }
}

function toggleBookingDetails(customer){
  const box = document.getElementById('chatMessages');
  const existing = document.getElementById('booking-details-block');
  if (existing){ existing.remove(); return; }

  const div = document.createElement('div');
  div.className = 'booking-details';
  div.id = 'booking-details-block';
  div.innerHTML = customer.bookings.map(b => `
    <div><strong>Car:</strong> ${escapeHtml(b.car||'-')} | <strong>Price:</strong> ₹${escapeHtml(String(b.price||'-'))}</div>
    <div><strong>Problem:</strong> ${escapeHtml(b.problem||'-')}</div>
    <div><strong>Location:</strong> ${escapeHtml(b.location||'-')}</div>
    <div><strong>Remarks:</strong> ${escapeHtml(b.remarks||'-')}</div>
    <div><strong>Date:</strong> ${new Date(b.created_at).toLocaleString()}</div>
  `).join('<hr>');
  box.insertBefore(div, box.children[1] || null);
}

/* ============ QUICK REPLIES ============ */
function buildQuickReplies(){
  const wrap = document.getElementById('quickReplies');
  wrap.innerHTML = '';
  QUICK_REPLIES.forEach(text => {
    const chip = document.createElement('button');
    chip.className = 'quick-chip';
    chip.innerText = text;
    chip.onclick = () => {
      const input = document.getElementById('messageInput');
      input.value = text;
      autoGrow(input);
      input.focus();
    };
    wrap.appendChild(chip);
  });
}

/* ============ SEND MESSAGE ============ */
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}
function handleComposerKey(e){
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendCurrentMessage();
  }
}
async function sendCurrentMessage(){
  if (sendingInFlight) return;
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !selectedMobile) return;

  const mobile = selectedMobile;
  const nowIso = new Date().toISOString();

  // optimistic append
  const cust = allCustomers.find(c => c.mobile === mobile);
  const optimisticMsg = { message:text, is_from_customer:false, timestamp:nowIso, _pending:true, _tempId: Date.now() };
  if (cust) cust.chats.push(optimisticMsg);
  renderChat(cust, true);
  markBubblePending(optimisticMsg._tempId, true);

  input.value = '';
  autoGrow(input);
  sendingInFlight = true;
  document.getElementById('sendBtn').disabled = true;

  try{
    const res = await fetch(SEND_MSG_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ mobile: mobile, reply: text })
    });
    if (!res.ok) throw new Error('Send failed: ' + res.status);

    setLs('im_lastsent_' + mobile, nowIso);
    optimisticMsg._pending = false;
    renderChat(cust, true);
  }catch(e){
    console.error(e);
    optimisticMsg._failed = true;
    optimisticMsg._pending = false;
    renderChat(cust, true);
    toast('Message failed to send. Tap Retry to try again.');
  }finally{
    sendingInFlight = false;
    document.getElementById('sendBtn').disabled = false;
  }
}
function markBubblePending(){ /* visual handled by re-render classes above */ }

async function retrySend(mobile, msg){
  const cust = allCustomers.find(c => c.mobile === mobile);
  msg._failed = false;
  msg._pending = true;
  renderChat(cust, true);
  try{
    const res = await fetch(SEND_MSG_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ mobile: mobile, reply: msg.message })
    });
    if (!res.ok) throw new Error('Send failed: ' + res.status);
    setLs('im_lastsent_' + mobile, new Date().toISOString());
    msg._pending = false;
    renderChat(cust, true);
  }catch(e){
    console.error(e);
    msg._pending = false;
    msg._failed = true;
    renderChat(cust, true);
    toast('Message failed again. Please check connection.');
  }
}
