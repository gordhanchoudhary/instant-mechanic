<!-- demo.html -->
<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    { "imports": { "@google/genai": "https://esm.sh/@google/genai" } }
  </script>
</head>
<body>
  <button id="startBtn">Start call</button>
  <button id="stopBtn" disabled>End call</button>
  <div id="transcript" style="white-space:pre-wrap;margin-top:20px;font-family:monospace;"></div>

<script type="module">
import { GoogleGenAI, Modality } from "@google/genai";

let session, audioContext, micStream, scriptNode;
const transcriptEl = document.getElementById("transcript");

async function getToken() {
  const res = await fetch("https://ai.instantmechanic.online/bot/live-token");
  const data = await res.json();
  return data.token; // e.g. "auth_tokens/254aaa..."
}

async function startCall() {
  const token = await getToken();
  const ai = new GoogleGenAI({ apiKey: token });

  session = await ai.live.connect({
    model: "gemini-3.1-flash-live-preview",
    config: {
      responseModalities: [Modality.AUDIO],
      systemInstruction: `You are Instant Mechanic's roadside assistant.
        No filler words, no "okay/got it/sure". Ask for the vehicle issue,
        then location, then confirm. Keep replies to 1-2 short sentences.`,
      tools: [{
        functionDeclarations: [{
          name: "check_mechanic_availability",
          description: "Check nearby mechanic availability for a location",
          parameters: {
            type: "OBJECT",
            properties: { location: { type: "STRING" } },
            required: ["location"]
          }
        }]
      }]
    },
    callbacks: {
      onmessage: async (msg) => {
        if (msg.data) playAudioChunk(msg.data); // base64 PCM audio out
        if (msg.serverContent?.outputTranscription) {
          transcriptEl.textContent += "\nAgent: " + msg.serverContent.outputTranscription.text;
        }
        if (msg.toolCall) {
          for (const fc of msg.toolCall.functionCalls) {
            const result = await callDjangoTool(fc.name, fc.args);
            session.sendToolResponse({
              functionResponses: [{ id: fc.id, name: fc.name, response: result }]
            });
          }
        }
      },
      onerror: (e) => console.error("Live session error", e),
      onclose: () => console.log("Session closed")
    }
  });

  startMic();
  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000 } });
  audioContext = new AudioContext({ sampleRate: 16000 });
  const source = audioContext.createMediaStreamSource(micStream);
  scriptNode = audioContext.createScriptProcessor(4096, 1, 1);

  scriptNode.onaudioprocess = (e) => {
    const input = e.inputBuffer.getChannelData(0);
    const pcm16 = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      pcm16[i] = Math.max(-32768, Math.min(32767, input[i] * 32768));
    }
    const base64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
    session.sendRealtimeInput({ audio: { data: base64, mimeType: "audio/pcm;rate=16000" } });
  };

  source.connect(scriptNode);
  scriptNode.connect(audioContext.destination);
}

function playAudioChunk(base64Data) {
  // decode base64 PCM 24kHz, queue + play — use a simple AudioContext buffer player
  const bytes = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
  const pcm16 = new Int16Array(bytes.buffer);
  const playCtx = new AudioContext({ sampleRate: 24000 });
  const buffer = playCtx.createBuffer(1, pcm16.length, 24000);
  const channel = buffer.getChannelData(0);
  for (let i = 0; i < pcm16.length; i++) channel[i] = pcm16[i] / 32768;
  const src = playCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(playCtx.destination);
  src.start();
}

async function callDjangoTool(name, args) {
  const res = await fetch(`https://ai.instantmechanic.online/bot/tools/${name}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(args)
  });
  return await res.json();
}

document.getElementById("startBtn").onclick = startCall;
document.getElementById("stopBtn").onclick = () => {
  session?.close();
  micStream?.getTracks().forEach(t => t.stop());
  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
};
</script>
</body>
</html>
