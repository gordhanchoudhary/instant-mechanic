<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instant Mechanic — Problem Guide</title>
<style>
  :root{
    --bg:#F7F6F3;
    --panel:#FFFFFF;
    --ink:#1D2321;
    --ink-soft:#565F5C;
    --line:#E2E0D9;
    --accent:#D2691E;
    --accent-ink:#7A3B0E;
    --minor:#3E8E5A;
    --minor-bg:#E7F3EA;
    --moderate:#B8860B;
    --moderate-bg:#FBF1DA;
    --major:#C1601F;
    --major-bg:#FCEBDD;
    --critical:#C23B3B;
    --critical-bg:#FBE6E6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    color:#F7F6F3;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header.top .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  header.top .brand .mark{
    width:10px;height:10px;border-radius:2px;background:var(--accent);
    display:inline-block;
  }
  header.top h1{
    font-size:17px; font-weight:650; margin:0; letter-spacing:0.2px;
  }
  header.top .sub{
    font-size:12.5px; color:#B9BEBB;
  }

  .crumbs{
    max-width:1080px; margin:0 auto; padding:16px 20px 0 20px;
    font-size:13.5px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  .crumbs button{
    background:none;border:none;color:var(--accent-ink);cursor:pointer;
    font-size:13.5px; padding:2px 4px; font-family:inherit;
  }
  .crumbs button:hover{ text-decoration:underline; }
  .crumbs .sep{ color:#B9B6AC; }
  .crumbs .current{ color:var(--ink); font-weight:600; }

  main{
    max-width:1080px; margin:0 auto; padding:18px 20px 80px 20px;
  }

  /* ---------- Home: category grid ---------- */
  .search-row{
    margin-bottom:18px;
  }
  .search-row input{
    width:100%;
    padding:12px 14px;
    font-size:15px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel);
    color:var(--ink);
    font-family:inherit;
  }
  .search-row input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  .home-intro{
    color:var(--ink-soft); font-size:14px; margin:0 0 18px 0;
  }

  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:12px;
  }
  .cat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    display:flex; flex-direction:column; gap:8px;
    transition:border-color .12s ease, transform .12s ease;
  }
  .cat-card:hover{ border-color:var(--accent); }
  .cat-card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .cat-card .num{
    font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .cat-card .name{
    font-size:15px; font-weight:600; line-height:1.3;
  }
  .cat-card .meta{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--ink-soft); margin-top:auto; padding-top:4px;
  }
  .cat-card .count{ font-variant-numeric:tabular-nums; }

  /* ---------- Subcategory list ---------- */
  .cat-header{
    margin-bottom:16px;
  }
  .cat-header h2{
    font-size:22px; margin:0 0 4px 0;
  }
  .cat-header .stats{
    color:var(--ink-soft); font-size:13.5px;
  }

  .sub-list{
    display:flex; flex-direction:column; gap:8px;
  }
  .sub-row{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    width:100%;
  }
  .sub-row:hover{ border-color:var(--accent); }
  .sub-row:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sub-row .name{
    font-size:14.5px; font-weight:600; flex:1;
  }
  .sub-row .desc{
    font-size:12.5px; color:var(--ink-soft);
    display:none;
  }
  .sub-row .arrow{ color:var(--ink-soft); font-size:14px; }

  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.Minor{ color:var(--minor); background:var(--minor-bg); }
  .badge.Moderate{ color:var(--moderate); background:var(--moderate-bg); }
  .badge.Major{ color:var(--major); background:var(--major-bg); }
  .badge.Critical{ color:var(--critical); background:var(--critical-bg); }

  /* ---------- Detail view ---------- */
  .detail-header{
    margin-bottom:18px;
  }
  .detail-header .cat-tag{
    font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;
  }
  .detail-header h2{
    font-size:22px; margin:6px 0 10px 0;
  }

  .section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:14px;
  }
  .section h3{
    font-size:13px; text-transform:none; letter-spacing:0.2px;
    margin:0 0 8px 0; color:var(--ink);
    font-weight:700;
  }
  .section p{ margin:0; font-size:14.5px; color:var(--ink); }
  .section .tag-line{ font-size:13px; color:var(--ink-soft); margin-top:6px; }

  .two-col{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  @media (max-width:680px){ .two-col{ grid-template-columns:1fr; } }

  ol.steps{
    margin:0; padding-left:20px; font-size:14.5px;
  }
  ol.steps li{ margin-bottom:6px; }

  table.price-table{
    width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px;
  }
  table.price-table th, table.price-table td{
    text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
  }
  table.price-table th{
    color:var(--ink-soft); font-weight:600; font-size:12.5px;
  }
  table.price-table td.segment{ font-weight:600; white-space:nowrap; }

  .examples-box{
    font-size:13.5px; color:var(--ink-soft); font-style:italic;
  }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }

  footer.foot{
    max-width:1080px; margin:0 auto; padding:10px 20px 40px 20px;
    color:var(--ink-soft); font-size:12px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark"></span>
    <h1>Instant Mechanic — Problem Guide</h1>
  </div>
  <div class="sub">47 categories · 193 fault types · symptoms, fixes &amp; pricing</div>
</header>

<div class="crumbs" id="crumbs"></div>

<main id="main"></main>

e customer to avoid leaving accessories on with engine off.", "partsBudget": "₹0 (no parts)", "partsMid": "₹0 (no parts)", "partsPremium": "₹0 (no parts)", "laborBudget": "₹150 – ₹300", "laborMid": "₹200 – ₹390", "laborPremium": "₹270 – ₹550"}, {"severity": "Moderate", "name": "Fully discharged battery", "description": "Battery completely flat, car does not crank at all.", "resolution": "Roadside — jump start or portable booster", "examples": "Battery dead, Battery Discharge", "onRoad": "Higher-output jump-starter pack/booster van; jump leads. ~10-15 min, doorstep-solvable in nearly all cases.", "symptoms": "No crank, no response at all (not even dashboard lights); central locking may also fail to respond; clicking sound when key/button pressed.", "repair": "1) Check terminals for looseness/corrosion before jumping. 2) Connect a higher-output jump pack/booster van (standard pack may be insufficient for a fully dead battery). 3) Attempt start; if it fires, idle 15-20 min. 4) Load-test the battery on-site to rule out end-of-life failure. 5) If battery won't hold charge after idling, escalate to Major tier (replacement).", "partsBudget": "₹0 (no parts)", "partsMid": "₹0 (no parts)", "partsPremium": "₹0 (no parts)", "laborBudget": "₹200 – ₹400", "laborMid": "₹260 – ₹500", "laborPremium": "₹360 – ₹700"}, {"severity": "Moderate", "name": "Terminal corrosion / loose connection", "description": "Poor contact at terminals causing intermittent starting failure.", "resolution": "Roadside — clean & tighten terminals", "examples": "Battery connection loose, corrosion", "onRoad": "Wire brush/sandpaper, spanner set, petroleum jelly or terminal spray. ~15 min, fully doorstep-solvable.", "symptoms": "Intermittent starting (works sometimes, not others); visible white/greenish crust on terminals; terminal clamp wobbles when touched; dashboard flickers when car hits a bump.", "repair": "1) Disconnect negative terminal first, then positive. 2) Clean both terminals and clamp interiors wi lution": "Garage — diagnostics + alternator/circuit repair", "examples": "Battery keeps dying, alternator suspected", "onRoad": "Multimeter for on-site alternator-output test is doorstep-possible (~15 min); actual repair (alternator swap, wiring fix) usually needs garage-level tools/lift and is not reliably doorstep-solvable.", "symptoms": "New/healthy battery still dies within a day; battery warning light stays on while driving; dimming headlights at idle; whining noise from alternator area.", "repair": "1) Jump-start to get the car running. 2) With engine running, test alternator output at the battery terminals with a multimeter — should read 13.5-14.5V; below 13V indicates a charging fault. 3) Visually inspect alternator belt and wiring for damage. 4) If output is confirmed low/absent, do not attempt alternator replacement roadside — arrange tow or garage appointment for alternator/wiring repair.", "partsBudget": "₹0 for diagnosis; ₹3,000 – ₹8,000 if alternator/wiring replaced", "partsMid": "₹0 for diagnosis; ₹4,500 – ₹12,000 if alternator/wiring replaced", "partsPremium": "₹0 for diagnosis; ₹9,000 – ₹24,000 if alternator/wiring replaced", "laborBudget": "₹300 – ₹500 diagnosis; ₹800 – ₹1,500 repair", "laborMid": "₹390 – ₹650 diagnosis; ₹1,000 – ₹2,000 repair", "laborPremium": "₹550 – ₹900 diagnosis; ₹1,400 – ₹2,700 repair"}]}, {"num": 2, "name": "Tyre puncture / flat tyre / stepney / air fill", "total": 1071, "pct": "18.40%", "subs": [{"severity": "Minor", "name": "Low air pressure", "description": "Tyre underinflated but intact; no visible damage.", "resolution": "Roadside — air fill", "examples": "Air fill needed, tyre pressure low", "onRoad": "Portable air compressor + pressure gauge. ~5 min, fully doorstep-solvable.", "symptoms": "Car pulls slightly to one side; tyre looks visibly under-inflated; low-pressure warning light on dashboard; increased road noise.", "repair": "1) Check pressure with a gauge on all four tyres. 2) Identify manufacturer-recommended PSI from the door-jamb sticker. 3) Inflate the affected tyre(s) to spec using a compressor. 4) Recheck pressure after inflation. 5) Visually inspect tread for any embedded object causing gradual loss.", "partsBudget": "₹0 (no parts)", "partsMid": "₹0 (no parts)", "partsPremium": "₹0 (no parts)", "laborBudget": "₹0 – ₹100", "laborMid": "₹0 – ₹130", "laborPremium": "₹0 – ₹180"}, {"severity": "Minor", "name": "Slow / pinhole puncture", "description": "Small leak (nail, thorn) losing air gradually.", "resolution": "Roadside — puncture plug/patch", "examples": "Slow puncture, small leak", "onRoad": "Tubeless puncture repair kit (plug, rubber cement, reamer, insertion tool), air compressor. ~15-20 min, fully doorstep-solvable.", "symptoms": "Tyre pressure keeps dropping over days; hissing sound near a specific spot on the tyre; visible nail/thorn/screw lodged in tread.", "repair": "1) Locate the puncture (soapy water test if not obvious). 2) Remove the embedding object with pliers. 3) Ream the hole to prepare it. 4) Insert rubber cement and plug using the insertion tool. 5) Trim excess plug, inflate to spec, and soap-test to confirm no further leak.", "partsBudget": "₹50 – ₹150 (plug/patch kit)", "partsMid": "₹80 – ₹220 (plug/patch kit)", "partsPremium": "₹150 – ₹450 (plug/patch kit)", "laborBudget": "₹100 – ₹250", "laborMid": "₹130 – ₹320", "laborPremium": "₹180 – ₹450"}, {"severity": "Moderate", "name": "Flat tyre", "description": "Tyre fully deflated; drivable only on spare.", "resolution": "Roadside — puncture repair or stepney (spare) change", "examples": "Flat tyre, Puncture", "onRoad": "Jack, wheel spanner, spare tyre (stepney), wheel chocks; or puncture kit if tubeless and repairable in place. ~15-20 min, fully doorstep-solvable.", "symptoms": "Tyre completely flat/visibly sagging; car sitting at an angle; grinding/flapping sound if driven; steering pulls hard to one side.", "repair": "1) Park on level, safe ground; engage handbrake and chock wheels. 2) Loosen wheel ium": "₹1,800 – ₹4,500"}, {"severity": "Critical", "name": "Major harness damage / fire risk", "description": "Widespread wiring damage with burning smell or spark risk.", "resolution": "Tow to garage — safety issue", "examples": "Wiring burnt, smell of burning", "onRoad": "Not doorstep-solvable — safety risk; requires tow to garage for full harness repair.", "symptoms": "Strong burning smell; visible melted/blackened wiring or insulation; smoke from under the dashboard or engine bay; multiple systems failing at once.", "repair": "1) Instruct the customer to switch off the engine and disconnect the battery negative terminal immediately if it is safe to do so. 2) Do not attempt to operate any electrical component. 3) Do not attempt roadside repair given fire risk. 4) Arrange a tow to garage. 5) At garage — full harness inspection and repair/replacement of damaged sections.", "partsBudget": "₹3,000 – ₹10,000 (harness section)", "partsMid": "₹4,500 – ₹15,000 (harness section)", "partsPremium": "₹9,000 – ₹30,000 (harness section)", "laborBudget": "₹2,500 – ₹6,000", "laborMid": "₹3,200 – ₹8,000", "laborPremium": "₹4,500 – ₹11,000"}]}, {"num": 10, "name": "Key lockout / central lock / alarm / remote", "total": 114, "pct": "2.00%", "subs": [{"severity": "Minor", "name": "Remote battery dead", "description": "Key fob unresponsive due to battery.", "resolution": "Roadside — battery swap / mechanical key entry", "examples": "Key remote not working", "onRoad": "Spare coin-cell battery matching fob type, small screwdriver. ~5-10 min, fully doorstep-solvable.", "symptoms": "Remote button presses get no response (no lock/unlock beep or light flash); car can still be opened with the mechanical key blade if present.", "repair": "1) Open the fob's battery compartment using a small screwdriver. 2) Note the battery type/size (commonly CR2032/CR2025). 3) Replace with a fresh battery of the same type, correct polarity. 4) Reassemble the fob and test lock/unlock function. 5) If still unr  "laborMid": "₹1,300 – ₹2,600", "laborPremium": "₹1,800 – ₹3,600"}, {"severity": "Major", "name": "Detailed used-car inspection", "description": "Comprehensive check flagged for a used vehicle.", "resolution": "Garage — detailed inspection", "examples": "Used car detailed check", "onRoad": "Comprehensive toolkit + scanner + jack for underbody check; largely doorstep-solvable (~60-90 min), though a lift-based check (e.g., alignment) needs garage.", "symptoms": "Customer specifically requests a deeper check due to a concern (e.g., suspected accident history, unusual noise); more thorough than a standard pre-purchase check.", "repair": "1) Perform all standard pre-purchase inspection steps. 2) Jack up the vehicle to inspect the underbody, suspension components, and exhaust for wear/damage/repair signs. 3) Check chassis numbers/VIN plates for consistency and signs of tampering. 4) Note any items that would need a garage lift for a full alignment/structural check. 5) Compile a detailed report of findings for the customer.", "partsBudget": "₹0", "partsMid": "₹0", "partsPremium": "₹0", "laborBudget": "₹1,500 – ₹3,000", "laborMid": "₹2,000 – ₹3,900", "laborPremium": "₹2,700 – ₹5,500"}, {"severity": "Critical", "name": "Major fault found during inspection", "description": "Inspection reveals a significant issue requiring garage referral.", "resolution": "Garage — repair referral", "examples": "Big problem, inspection needed", "onRoad": "The inspection itself is doorstep-solvable; the flagged repair is referred out and is not doorstep-completable.", "symptoms": "During inspection, a significant issue is uncovered (e.g., structural damage, major engine fault, extensive rust) that changes the vehicle's viability or safety.", "repair": "1) Complete the inspection checklist as planned. 2) Clearly document and photograph the significant issue found. 3) Explain the finding and its implications plainly to the customer (cost, safety, or purchase-decision impact). 4) Refer the specific issue to a garage for a detailed repair quote/second opinion before any purchase or continued use decision.", "partsBudget": "N/A — referred to garage", "partsMid": "N/A — referred to garage", "partsPremium": "N/A — referred to garage", "laborBudget": "₹1,500 – ₹3,000 (inspection only)", "laborMid": "₹2,000 – ₹3,900 (inspection only)", "laborPremium": "₹2,700 – ₹5,500 (inspection only)"}]}, {"num": 34, "name": "Smoke / burning smell", "total": 21, "pct": "0.40%", "subs": [{"severity": "Minor", "name": "Faint smell, no smoke", "description": "Odor noticed but no visible smoke.", "resolution": "Roadside check", "examples": "Faint burning smell", "onRoad": "Visual/olfactory check under the hood, basic toolkit. ~15 min, doorstep-solvable as a diagnosis.", "symptoms": "Customer notices a faint burning smell, but no smoke is visible; smell may only appear intermittently, e.g., after climbing a slope or heavy braking.", "repair": "1) Open the bonnet and visually/olfactorily inspect the engine bay for the smell's likely source (belt area, exhaust manifold, brakes). 2) Check for any material (plastic bag, leaves) resting on a hot surface. 3) Check brake temperatures at each wheel (a dragging brake can cause this smell). 4) If no clear source found, advise the customer to monitor and report if it recurs or smoke appears.", "partsBudget": "₹0", "partsMid": "₹0", "partsPremium": "₹0", "laborBudget": "₹200 – ₹400", "laborMid": "₹260 – ₹500", "laborPremium": "₹360 – ₹700"}, {"severity": "Moderate", "name": "Burning smell (belt/clutch)", "description": "Smell traced to friction component like belt or clutch.", "resolution": "Roadside diagnosis + Garage", "examples": "Burning smell", "onRoad": "Inspection of belt/clutch area with basic toolkit (~15-20 min); adjustment doorstep-solvable if minor, replacement needs garage.", "symptoms": "Distinct burning-rubber smell, often noticeable after hard acceleration, hill climbs, or heavy clutch use; may be accompanied by a slight squeal.", "repair": "1) Inspect the drive belt for glazing or slipping (a slipping belt produces a distinct burning-rubber smell). 2) Check clutch engagement point for signs of slipping if it's a manual transmission. 3) Adjust belt tension if that resolves the issue. 4) If clutch slipping is confirmed as the source, refer to garage per Category 6 guidance.", "partsBudget": "₹0 – ₹1,500 (belt/adjustment)", "partsMid": "₹0 – ₹2,200 (belt/adjustment)", "partsPremium": "₹0 – ₹4,500 (belt/adjustment)", "laborBudget": "₹400 – ₹800", "laborMid": "₹500 – ₹1,000", "laborPremium": "₹700 – ₹1,400"}, {"severity": "Major", "name": "Visible smoke (electrical/oil)", "description": "Smoke visibly present from engine bay or electrical source.", "resolution": "Roadside — stop and inspect / Garage", "examples": "Car emitting smoke", "onRoad": "Immediate stop-and-inspect with basic diagnostic tools; source identification doorstep-possible, but repair often needs garage.", "symptoms": "Visible smoke (white, blue, or black depending on cause) from the engine bay, exhaust, or dashboard area; may be accompanied by a strong smell of oil or electrical burning.", "repair": "1) Instruct the customer to stop the vehicle immediately and switch off the engine. 2) Do not open the bonnet immediately if flames are suspected — wait for smoke to reduce and check for heat. 3) Once safe, identify the smoke's likely source (oil dripping on exhaust, electrical component, coolant). 4) If the cause is a simple, quickly fixable item, address it; otherwise refer to garage for repair given the smoke indicates an active issue.", "partsBudget": "₹500 – ₹3,000", "partsMid": "₹750 – ₹4,500", "partsPremium": "₹1,500 – ₹9,000", "laborBudget": "₹800 – ₹1,500", "laborMid": "₹1,000 – ₹2,000", "laborPremium": "₹1,400 – ₹2,700"}, {"severity": "Critical", "name": "Burst pipe with smoke — fire risk", "description": "Fluid pipe burst causing smoke, potential fire hazard.", "resolution": "Tow — do not drive further", "examples": "Burst oil pipe and smoke", "onRoad": "Not doorstep-solvable — fire risk; do not drive, tow immediately.", "symptoms": "Significant smoke accompanied by a burst/spraying fluid line; strong burning smell intensifying; possible visible flame or sparking.", "repair": "1) Instruct the customer to stop immediately, switch off the engine, and evacuate the vehicle as a safety precaution. 2) Do not attempt any on-site fix given the fire risk. 3) If flames are visible, advise use of a fire extinguisher if available and call emergency services. 4) Once safe, arrange a tow to garage — never drive the vehicle further in this state.", "partsBudget": "₹1,500 – ₹5,000", "partsMid": "₹2,200 – ₹7,500", "partsPremium": "₹4,500 – ₹15,000", "laborBudget": "₹1,500 – ₹3,000 + towing ₹1,000 – ₹2,500", "laborMid": "₹2,000 – ₹3,900 + towing ₹1,300 – ₹3,200", "laborPremium": "₹2,700 – ₹5,500 + towing ₹1,800 – ₹4,500"}]}, {"num": 35, "name": "Waterlogging / car stuck in water or pit", "total": 18, "pct": "0.30%", "subs": [{"severity": "Minor", "name": "Car stuck in mud/soft ground", "description": "Stuck due to soft terrain, no water involvement.", "resolution": "Roadside — pull out", "examples": "Car stuck in mud", "onRoad": "Tow rope/strap, traction mats, another vehicle. ~15-20 min, fully doorstep-solvable.", "symptoms": "Wheels spinning in mud/soft soil without gaining traction; vehicle otherwise mechanically fine; no water contact with the vehicle body.", "repair": "1) Assess the ground condition and identify the best pulling direction. 2) Place traction mats under the driven wheels if available. 3) Attach a tow rope/strap to the rated recovery point. 4) Use a second vehicle to gently pull the car onto firm ground. 5) Check underneath for any mud-related damage before releasing.", "partsBudget": "₹0", "partsMid": "₹0", "partsPremium": "₹0", "laborBudget": "₹300 – ₹800", "laborMid": "₹390 – ₹1,000", "laborPremium": "₹550 – ₹1,400"}, {"severity": "Moderate", "name": "Car stuck in shallow water", "description": "Wheels in shallow water, engine unaffected.", "resolution": "Roadside — pull out", "examples": "Car in flood, shallow", "onRoad": "Tow rope/winch to pull the vehicle clear. ~15-20 min, fully doorstep-solvable.", "symptoms": "Wheels submerged in shallow water (below the door sill level); engine still running fine; no water has entered the cabin or engine bay.", "repair": "1) Confirm the water level is below any critical intake points before proceeding. 2) Attach a tow rope/winch to the rated recovery point. 3) Pull the vehicle clear of the water onto dry ground. 4) Check the underside and brakes (water can affect brake performance temporarily) before releasing the vehicle.", "partsBudget": "₹0", "partsMid": "₹0", "partsPremium": "₹0", "laborBudget": "₹300 – ₹800", "laborMid": "₹390 – ₹1,000", "laborPremium": "₹550 – ₹1,400"}, {"severity": "Major", "name": "Car partially submerged", "description": "Water level near/at door sills, water-ingress risk.", "resolution": "Roadside recovery + Garage check", "examples": "Car on divider, part flooded", "onRoad": "Winch/recovery vehicle to extract the car doorstep (~20-30 min); checking the air intake/engine for water ingress before restart needs care, sometimes garage-referred.", "symptoms": "Water level at or near the door sills; possible water staining inside the cabin footwell; engine may have already stalled from water ingress into the intake.", "repair": "1) Do not attempt to restart the engine if there's any chance water has entered the intake. 2) Use a winch/recovery vehicle to extract the car from the water. 3) Once out, check the air filter/intake for water presence. 4) If water ingress into the engine is suspected, recommend garage check before any restart attempt to avoid hydro-lock damage.", "partsBudget": "₹0", "partsMid": "₹0", "partsPremium": "₹0", "laborBudget": "₹800 – ₹2,000", "laborMid": "₹1,000 – ₹2,600", "laborPremium": "₹1,400 – ₹3,600"}, {"severity": "Critical", "name": "Car fully stuck/submerged (hydro-lock risk)", "description": "Significant submersion with risk of engine hydro-lock.", "resolution": "Tow + Garage — engine inspection", "examples": "Car fully stuck in flood water", "onRoad": "Not doorstep-solvable — requires tow and garage inspection for hydro-lock before any attempt to start the engine.", "symptoms": "Vehicle significantly or fully submerged (water above door sill/dashboard level); engine will not start or was switched off during submersion; interior visibly waterlogged.", "repair": "1) Do not attempt to start the engine under any circumstances — this risks catastrophic hydro-lock damage. 2) Ensure occupant safety is addressed first if this occurred with people inside. 3) Arrange a flatbed tow to garage. 4) At garage — engine must be inspected for water in the cylinders before any start attempt, and electrical systems checked for water damage.", "partsBudget": "Varies — engine inspection separate (₹5,000 – ₹30,000)", "partsMid": "Varies — engine inspection separate (₹7,500 – ₹45,000)", "partsPremium": "Varies — engine inspection separate (₹15,000 – ₹90,000)", "laborBudget": "₹2,000 – ₹5,000 + towing ₹1,500 – ₹3,000", "laborMid": "₹2,600 – ₹6,500 + towing ₹2,000 – ₹3,900", "laborPremium": "₹3,600 – ₹9,000 + towing ₹2,700 – ₹5,500"}]}, {"num": 36, "name": "Starter motor / push start issue", "total": 17, "pct": "0.30%", "subs": [{"severity": "Minor", "name": "Push-start slow response", "description": "Slight delay when pressing start button.", "resolution": "Roadside check", "examples": "Push start slow", "onRoad": "Battery/terminal check with basic toolkit. ~10-15 min, doorstep-solvable.", "symptoms": "Slight delay between pressing the start button and the engine actually cranking; happens occasionally, not every time; battery otherwise seems fine.", "repair": "1) Check battery terminal tightness and cleanliness. 2) Test battery voltage with a multimeter. 3) Clean/tighten terminals if needed. 4) Retest the push-start function thr <script>
(function(){
  var DATA = JSON.parse(document.getElementById('data-json').textContent);
  var mainEl = document.getElementById('main');
  var crumbsEl = document.getElementById('crumbs');

  // route: {view:'home'} | {view:'cat', cat:n} | {view:'sub', cat:n, sub:n}
  function parseHash(){
    var h = location.hash.replace(/^#\/?/, '');
    if(!h) return {view:'home'};
    var parts = h.split('/');
    if(parts[0] === 'category' && parts[1] !== undefined){
      var c = parseInt(parts[1], 10);
      if(parts[2] === 'sub' && parts[3] !== undefined){
        return {view:'sub', cat:c, sub:parseInt(parts[3], 10)};
      }
      return {view:'cat', cat:c};
    }
    return {view:'home'};
  }

  function nav(hash){ location.hash = hash; }

  function findCat(num){
    for(var i=0;i<DATA.length;i++){ if(DATA[i].num === num) return DATA[i]; }
    return null;
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function severityCounts(cat){
    var counts = {Minor:0, Moderate:0, Major:0, Critical:0};
    cat.subs.forEach(function(s){ counts[s.severity] = (counts[s.severity]||0) + 1; });
    return counts;
  }

  function renderCrumbs(route){
    var html = '';
    html += '<button id="crumb-home">All categories</button>';
    if(route.view === 'cat' || route.view === 'sub'){
      var cat = findCat(route.cat);
      html += '<span class="sep">/</span>';
      if(route.view === 'cat'){
        html += '<span class="current">' + esc(cat ? cat.name : '') + '</span>';
      } else {
        html += '<button id="crumb-cat">' + esc(cat ? cat.name : '') + '</button>';
      }
    }
    if(route.view === 'sub'){
      var cat2 = findCat(route.cat);
      var sub = cat2 ? cat2.subs[route.sub] : null;
      html += '<span class="sep">/</span>';
      html += '<span class="current">' + esc(sub ? sub.name : '') + '</span>';
    }
    crumbsEl.innerHTML = html;
    var homeBtn = document.getElementById('crumb-home');
    if(homeBtn) homeBtn.addEventListener('click', function(){ nav('#/'); });
    var catBtn = document.getElementById('crumb-cat');
    if(catBtn) catBtn.addEventListener('click', function(){ nav('#/category/' + route.cat); });
  }

  function renderHome(query){
    var q = (query || '').trim().toLowerCase();
    var filtered = DATA;
    if(q){
      filtered = DATA.filter(function(c){
        if(c.name.toLowerCase().indexOf(q) !== -1) return true;
        return c.subs.some(function(s){
          return s.name.toLowerCase().indexOf(q) !== -1 ||
                 s.examples.toLowerCase().indexOf(q) !== -1 ||
                 s.symptoms.toLowerCase().indexOf(q) !== -1;
        });
      });
    }
    var cards = filtered.map(function(c){
      return '<button class="cat-card" data-cat="' + c.num + '">' +
        '<div class="num">Category ' + c.num + '</div>' +
        '<div class="name">' + esc(c.name) + '</div>' +
        '<div class="meta"><span>' + c.subs.length + ' fault types</span>' +
        '<span class="count">' + c.total.toLocaleString() + ' tickets</span></div>' +
        '</button>';
    }).join('');

    var emptyMsg = filtered.length === 0
      ? '<div class="empty-state">No categories or symptoms match "' + esc(query) + '". Try a different word.</div>'
      : '';

    mainEl.innerHTML =
      '<p class="home-intro">Pick a problem category to see its fault types, or search for a symptom below.</p>' +
      '<div class="search-row"><input id="search-box" type="text" placeholder="Search categories or symptoms — e.g. \u201coverheating\u201d, \u201cbrake\u201d, \u201ckey lockout\u201d" value="' + esc(query||'') + '"></div>' +
      '<div class="cat-grid">' + cards + '</div>' + emptyMsg;

    var box = document.getElementById('search-box');
    box.addEventListener('input', function(){
      renderHome(box.value);
      // restore caret position and focus after re-render
      var newBox = document.getElementById('search-box');
      newBox.focus();
      newBox.setSelectionRange(newBox.value.length, newBox.value.length);
    });
    mainEl.querySelectorAll('.cat-card').forEach(function(btn){
      btn.addEventListener('click', function(){ nav('#/category/' + btn.getAttribute('data-cat')); });
    });
  }

  function renderCat(catNum){
    var cat = findCat(catNum);
    if(!cat){ renderHome(); return; }
    var counts = severityCounts(cat);
    var statParts = ['Minor','Moderate','Major','Critical'].filter(function(k){ return counts[k] > 0; })
      .map(function(k){ return counts[k] + ' ' + k; });

    var rows = cat.subs.map(function(s, idx){
      return '<button class="sub-row" data-sub="' + idx + '">' +
        '<span class="badge ' + s.severity + '">' + s.severity + '</span>' +
        '<span class="name">' + esc(s.name) + '</span>' +
        '<span class="arrow">&rsaquo;</span>' +
        '</button>';
    }).join('');

    mainEl.innerHTML =
      '<div class="cat-header">' +
        '<h2>' + esc(cat.name) + '</h2>' +
        '<div class="stats">' + cat.total.toLocaleString() + ' all-time tickets (' + cat.pct + ' of total) &middot; ' + statParts.join(' &middot; ') + '</div>' +
      '</div>' +
      '<div class="sub-list">' + rows + '</div>';

    mainEl.querySelectorAll('.sub-row').forEach(function(btn){
      btn.addEventListener('click', function(){
        nav('#/category/' + catNum + '/sub/' + btn.getAttribute('data-sub'));
      });
    });
  }

  function priceTable(s){
    return '<table class="price-table">' +
      '<thead><tr><th>Vehicle segment</th><th>Parts price range</th><th>Labor charge range</th></tr></thead>' +
      '<tbody>' +
      '<tr><td class="segment">Budget car (&lt;\u20b910L)</td><td>' + esc(s.partsBudget) + '</td><td>' + esc(s.laborBudget) + '</td></tr>' +
      '<tr><td class="segment">Mid-range car (\u20b910\u201325L)</td><td>' + esc(s.partsMid) + '</td><td>' + esc(s.laborMid) + '</td></tr>' +
      '<tr><td class="segment">Premium car (&gt;\u20b925L)</td><td>' + esc(s.partsPremium) + '</td><td>' + esc(s.laborPremium) + '</td></tr>' +
      '</tbody></table>';
  }

  function renderSub(catNum, subIdx){
    var cat = findCat(catNum);
    if(!cat){ renderHome(); return; }
    var s = cat.subs[subIdx];
    if(!s){ renderCat(catNum); return; }

    mainEl.innerHTML =
      '<div class="detail-header">' +
        '<div class="cat-tag">' + esc(cat.name) + '</div>' +
        '<span class="badge ' + s.severity + '">' + s.severity + '</span>' +
        '<h2>' + esc(s.name) + '</h2>' +
      '</div>' +

      '<div class="section">' +
        '<h3>What this is</h3>' +
        '<p>' + esc(s.description) + '</p>' +
        '<div class="examples-box">Typical customer wording: ' + esc(s.examples) + '</div>' +
      '</div>' +

      '<div class="two-col">' +
        '<div class="section">' +
          '<h3>Common symptoms</h3>' +
          '<p>' + esc(s.symptoms) + '</p>' +
        '</div>' +
        '<div class="section">' +
          '<h3>Resolution &amp; where it happens</h3>' +
          '<p>' + esc(s.resolution) + '</p>' +
          '<div class="tag-line">' + esc(s.onRoad) + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<h3>Repair instructions</h3>' +
        '<ol class="steps">' + s.repair.split(/\s*\d+\)\s*/).filter(Boolean).map(function(step){
          return '<li>' + esc(step.replace(/\.\s*$/, '')) + '.</li>';
        }).join('') + '</ol>' +
      '</div>' +

      '<div class="section">' +
        '<h3>Estimated pricing by vehicle segment</h3>' +
        priceTable(s) +
      '</div>';
  }

  function render(){
    var route = parseHash();
    renderCrumbs(route);
    if(route.view === 'home'){ renderHome(); }
    else if(route.view === 'cat'){ renderCat(route.cat); }
    else if(route.view === 'sub'){ renderSub(route.cat, route.sub); }
    window.scrollTo(0,0);
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
