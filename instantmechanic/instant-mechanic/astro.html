<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Instant Mechanic — AI Diagnosis Call</title>
<style>
  :root{
    --accent:#FF6A1A;
    --danger:#E03B2E;
    --ok:#1FBF75;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; background:#0A0B0D; color:#fff;
    font-family:'Inter',-apple-system,sans-serif; overflow:hidden;
  }
  #app{ position:fixed; inset:0; }

  /* ---------- Fullscreen camera video ---------- */
  video#cam{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000;
  }
  .scrim-top{
    position:absolute; top:0; left:0; right:0; height:140px;
    background:linear-gradient(180deg, rgba(0,0,0,.65), transparent); pointer-events:none;
  }
  .scrim-bottom{
    position:absolute; bottom:0; left:0; right:0; height:220px;
    background:linear-gradient(0deg, rgba(0,0,0,.75), transparent); pointer-events:none;
  }

  /* ---------- Header ---------- */
  .call-header{
    position:absolute; top:0; left:0; right:0; padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; z-index:5;
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand img{ height:22px; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .brand-name{ font-size:13.5px; font-weight:700; letter-spacing:-.01em; }
  .call-meta{
    display:flex; align-items:center; gap:7px; background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.15); backdrop-filter:blur(6px);
    padding:6px 11px; border-radius:999px; font-size:12px; font-weight:600;
  }
  .rec-dot{ width:7px; height:7px; border-radius:50%; background:var(--danger); animation:blink 1.4s ease infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  #timer{ font-variant-numeric:tabular-nums; }

  /* ---------- Start screen ---------- */
  .start-screen{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px;
    background:radial-gradient(circle at 50% 30%, #1A1D22, #0A0B0D 70%);
  }
  .start-screen .logo-big{ height:34px; margin-bottom:22px; }
  .avatar-ring{
    width:112px; height:112px; border-radius:50%; margin-bottom:22px; position:relative;
    background:linear-gradient(160deg,#FF8A45,var(--accent)); display:flex; align-items:center; justify-content:center;
    box-shadow:0 20px 50px rgba(255,106,26,.3);
  }
  .avatar-ring::before{
    content:""; position:absolute; inset:-10px; border-radius:50%; border:1.5px solid rgba(255,106,26,.4);
    animation:idle-ring 2.6s ease-out infinite;
  }
  @keyframes idle-ring{ 0%{transform:scale(.9);opacity:.9;} 100%{transform:scale(1.35);opacity:0;} }
  .avatar-ring svg{ width:48px; height:48px; }
  .start-screen h1{ font-size:21px; margin:0 0 6px; font-weight:700; }
  .start-screen p{ font-size:13.5px; color:#9CA0AA; margin:0 0 34px; max-width:280px; line-height:1.5; }
  .btn-start{
    width:76px; height:76px; border-radius:50%; border:none; background:var(--ok); cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 12px 30px rgba(31,191,117,.4);
  }
  .btn-start svg{ width:30px; height:30px; }
  .start-hint{ margin-top:14px; font-size:11.5px; color:#6A6F79; }

  /* ---------- Captions ---------- */
  .captions{
    position:absolute; left:0; right:0; bottom:130px; padding:0 20px; z-index:5;
    display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  .caption-line{
    max-width:88%; padding:9px 15px; border-radius:14px; font-size:14.5px; line-height:1.4;
    backdrop-filter:blur(8px); opacity:0; transform:translateY(6px); transition:opacity .25s ease, transform .25s ease;
  }
  .caption-line.show{ opacity:1; transform:translateY(0); }
  .caption-line.user{ background:rgba(255,106,26,.85); align-self:flex-end; border-bottom-right-radius:4px; }
  .caption-line.ai{ background:rgba(20,22,26,.72); border:1px solid rgba(255,255,255,.1); align-self:flex-start; border-bottom-left-radius:4px; }
  .caption-line .who{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.7; display:block; margin-bottom:2px; }

  /* ---------- Controls ---------- */
  .controls{
    position:absolute; left:0; right:0; bottom:0; padding:18px 24px 30px;
    display:flex; align-items:center; justify-content:center; gap:20px; z-index:6;
  }
  .ctrl-btn{
    width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.14); backdrop-filter:blur(10px); color:#fff;
    display:flex; align-items:center; justify-content:center; transition:background .15s;
  }
  .ctrl-btn:active{ background:rgba(255,255,255,.28); }
  .ctrl-btn.active-off{ background:#fff; color:#111; }
  .ctrl-btn svg{ width:22px; height:22px; }
  .ctrl-btn.end{ background:var(--danger); width:64px; }
  .ctrl-btn.end:active{ background:#B92A20; }

  /* ---------- Status toast ---------- */
  #statusToast{
    position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:6;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(8px);
    padding:7px 14px; border-radius:999px; font-size:12px; color:#D6D9DE; white-space:nowrap;
  }

  /* ---------- End screen ---------- */
  .end-screen{
    position:absolute; inset:0; z-index:25; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; background:#0A0B0D; padding:30px;
  }
  .end-screen h2{ font-size:19px; margin:18px 0 4px; }
  .end-screen p{ color:#9CA0AA; font-size:13px; margin:0 0 26px; }
  .btn-again{
    background:var(--accent); color:#fff; border:none; padding:13px 26px; border-radius:999px;
    font-weight:700; font-size:14px; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){ .avatar-ring::before, .rec-dot{ animation:none; } }
</style>
</head>
<body>
<div id="app">

  <video id="cam" autoplay muted playsinline></video>
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <div class="call-header">
    <div class="brand">
      <img src="https://instantmechanic.online/assets/img/logo.svg" alt="Instant Mechanic">
      <span class="brand-name">Instant Mechanic</span>
    </div>
    <div class="call-meta"><span class="rec-dot"></span><span id="timer">00:00</span></div>
  </div>

  <div id="statusToast" style="display:none;"></div>

  <div class="captions" id="captions"></div>

  <div class="controls" id="liveControls" style="display:none;">
    <button class="ctrl-btn" id="micBtn" aria-label="Mute microphone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
    </button>
    <button class="ctrl-btn end" id="endBtn" aria-label="End call">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-2.8 0-5.4.7-7.7 2-1 .5-1.3 1.8-.6 2.7l1.5 2c.5.7 1.5.9 2.2.5.9-.5 1.9-.9 3-1.1V13c0-.6.4-1 1-1h1.2c.6 0 1 .4 1 1v2.1c1.1.2 2.1.6 3 1.1.7.4 1.7.2 2.2-.5l1.5-2c.7-.9.4-2.2-.6-2.7C17.4 9.7 14.8 9 12 9z"/></svg>
    </button>
    <button class="ctrl-btn" id="flipBtn" aria-label="Flip camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>

  <!-- Start screen -->
  <div class="start-screen" id="startScreen">
    <img class="logo-big" src="https://instantmechanic.online/assets/img/logo.svg" alt="Instant Mechanic">
    <div class="avatar-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </div>
    <h1>AI Video Diagnosis</h1>
    <p>Point your camera at the issue and talk naturally — Anika will look, listen, and tell you what's wrong.</p>
    <button class="btn-start" id="startBtn" aria-label="Start call">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </button>
    <div class="start-hint">Camera &amp; mic access required</div>
  </div>

  <!-- End screen -->
  <div class="end-screen" id="endScreen">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1FBF75" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
    <h2>Call ended</h2>
    <p id="endSummary">Your diagnosis session is over.</p>
    <button class="btn-again" id="againBtn">Start another call</button>
  </div>

</div>

<script>
const CONFIG = {
  tokenEndpoint: "https://ai.instantmechanic.online/bot/get-token",
};

const params = new URLSearchParams(location.search);
const mobile = params.get("m") || params.get("mobile") || "";

let ws, stream, audioCtx, videoInterval, procNode, timerInterval, seconds = 0;
let micOn = true, usingBackCamera = true;
let outputCtx, nextPlayTime = 0;
let curUserLine = "", curAiLine = "";

const $ = (id) => document.getElementById(id);
const toast = (msg) => { $("statusToast").style.display = "block"; $("statusToast").textContent = msg; };
const hideToast = () => { $("statusToast").style.display = "none"; };

$("startBtn").onclick = startCall;
$("endBtn").onclick = endCall;
$("againBtn").onclick = () => location.reload();
$("micBtn").onclick = toggleMic;
$("flipBtn").onclick = flipCamera;

async function startCall(){
  $("startScreen").style.display = "none";
  toast("Connecting…");

  try{
    const res = await fetch(CONFIG.tokenEndpoint, { method: "POST" });
    const { token, model } = await res.json();

    stream = await getCameraStream(usingBackCamera);
    $("cam").srcObject = stream;

    ws = new WebSocket(
      `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=${token}`
    );

    ws.onopen = () => {
      ws.send(JSON.stringify({
        setup: {
          model: `models/${model}`,
          generationConfig: {
            responseModalities: ["AUDIO"],
            inputAudioTranscription: {},
            outputAudioTranscription: {}
          }
        }
      }));
    };

    ws.onmessage = handleServerMessage;
    ws.onerror = () => toast("Connection error");
    ws.onclose = () => { if ($("endScreen").style.display !== "flex") endCall("Session closed by server"); };

  } catch(e){
    toast("Couldn't start call: " + e.message);
  }
}

async function getCameraStream(back){
  try{
    return await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: back ? "environment" : "user" } },
      audio: true
    });
  } catch(e){
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === "videoinput");
    const pick = back
      ? (cams.find(d => /back|rear|environment/i.test(d.label)) || cams[cams.length - 1])
      : cams[0];
    if (pick){
      return navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: pick.deviceId } }, audio: true });
    }
    return navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  }
}

function handleServerMessage(evt){
  (async () => {
    const text = evt.data instanceof Blob ? await evt.data.text() : evt.data;
    let msg;
    try{ msg = JSON.parse(text); } catch(e){ return; }

    if (msg.setupComplete){
      hideToast();
      $("liveControls").style.display = "flex";
      startTimer();
      startMicStreaming();
      startVideoStreaming();
      return;
    }

    const sc = msg.serverContent;
    if (!sc) return;

    if (sc.inputTranscription?.text){
      curUserLine += sc.inputTranscription.text;
      renderCaption("user", curUserLine);
    }
    if (sc.outputTranscription?.text){
      curAiLine += sc.outputTranscription.text;
      renderCaption("ai", curAiLine);
    }
    if (sc.turnComplete){
      curUserLine = ""; curAiLine = "";
    }

    const audioB64 = sc.modelTurn?.parts?.[0]?.inlineData?.data;
    if (audioB64) playAudioChunk(audioB64);
  })();
}

// ---------- Captions (YouTube-style rolling lines) ----------
function renderCaption(who, text){
  const box = $("captions");
  let line = box.querySelector(`.caption-line.${who}`);
  if (!line){
    line = document.createElement("div");
    line.className = `caption-line ${who}`;
    line.innerHTML = `<span class="who">${who === "user" ? "You" : "Anika"}</span><span class="txt"></span>`;
    box.appendChild(line);
    if (box.children.length > 2) box.removeChild(box.firstChild);
  }
  line.querySelector(".txt").textContent = text;
  requestAnimationFrame(() => line.classList.add("show"));
  clearTimeout(line._fadeTimer);
  line._fadeTimer = setTimeout(() => { line.classList.remove("show"); setTimeout(() => line.remove(), 300); }, 6000);
}

// ---------- Video streaming ----------
function startVideoStreaming(){
  const track = stream.getVideoTracks()[0];
  const capture = new ImageCapture(track);
  videoInterval = setInterval(async () => {
    if (ws.readyState !== 1) return;
    try{
      const bitmap = await capture.grabFrame();
      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width; canvas.height = bitmap.height;
      canvas.getContext("2d").drawImage(bitmap, 0, 0);
      const jpegB64 = canvas.toDataURL("image/jpeg", 0.7).split(",")[1];
      ws.send(JSON.stringify({ realtimeInput: { video: { mimeType: "image/jpeg", data: jpegB64 } } }));
    } catch(e){}
  }, 1000);
}

// ---------- Mic streaming ----------
function startMicStreaming(){
  audioCtx = new AudioContext({ sampleRate: 16000 });
  const src = audioCtx.createMediaStreamSource(stream);
  procNode = audioCtx.createScriptProcessor(4096, 1, 1);
  src.connect(procNode); procNode.connect(audioCtx.destination);
  procNode.onaudioprocess = (e) => {
    if (ws.readyState !== 1 || !micOn) return;
    const input = e.inputBuffer.getChannelData(0);
    const pcm16 = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) pcm16[i] = input[i] * 32767;
    const b64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
    ws.send(JSON.stringify({ realtimeInput: { audio: { mimeType: "audio/pcm;rate=16000", data: b64 } } }));
  };
}

// ---------- Audio playback (gapless PCM16 @ 24kHz) ----------
function playAudioChunk(b64){
  if (!outputCtx) outputCtx = new AudioContext({ sampleRate: 24000 });
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pcm16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(pcm16.length);
  for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768;
  const buffer = outputCtx.createBuffer(1, float32.length, 24000);
  buffer.copyToChannel(float32, 0);
  const src = outputCtx.createBufferSource();
  src.buffer = buffer; src.connect(outputCtx.destination);
  const startAt = Math.max(outputCtx.currentTime, nextPlayTime);
  src.start(startAt);
  nextPlayTime = startAt + buffer.duration;
}

// ---------- Controls ----------
function toggleMic(){
  micOn = !micOn;
  stream.getAudioTracks().forEach(t => t.enabled = micOn);
  $("micBtn").classList.toggle("active-off", !micOn);
}

async function flipCamera(){
  usingBackCamera = !usingBackCamera;
  stream.getTracks().forEach(t => t.stop());
  clearInterval(videoInterval);
  stream = await getCameraStream(usingBackCamera);
  $("cam").srcObject = stream;
  startVideoStreaming();
}

function startTimer(){
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    $("timer").textContent = `${m}:${s}`;
  }, 1000);
}

function endCall(reason){
  clearInterval(videoInterval);
  clearInterval(timerInterval);
  if (procNode) procNode.disconnect();
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ws) ws.close();
  $("liveControls").style.display = "none";
  $("captions").innerHTML = "";
  $("endSummary").textContent = reason && typeof reason === "string" ? reason : `Call duration: ${$("timer").textContent}`;
  $("endScreen").style.display = "flex";
}
</script>
</body>
</html>
